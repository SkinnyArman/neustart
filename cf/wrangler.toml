name = "wg-finder"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# One trigger per module, so they never share a tick or a CPU budget:
#   rooms        every 2 min, on even minutes: refresh one listing, or post one room
#   finds        :05, :15, …: check the most overdue search, rate up to two ads
#   jobs         :03, :13, …: two Jobbörse searches, match up to three jobs
#   casual jobs  :07, :17, …: the Minijob search every 30 min, post up to five
# What each module looks for, and where, is in the config (neustart.yaml).
[triggers]
crons = ["*/2 * * * *", "5,15,25,35,45,55 * * * *", "3,13,23,33,43,53 * * * *", "7,17,27,37,47,57 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "wg-finder"
database_id = "2982a6b8-3107-401c-bed5-7a30249781f6"

[vars]
OPENAI_MODEL = "gpt-5.6-terra"
# rating bike and furniture ads is a small job: the budget model
FINDS_MODEL = "gpt-5.6-luna"
